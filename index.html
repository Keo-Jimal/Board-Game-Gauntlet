<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Game Gauntlet</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn { from {opacity:0} to {opacity:1} }
    @keyframes fadeInUp { from {opacity:0; transform:translateY(20px)} to {opacity:1; transform:translateY(0)} }
    @keyframes diceDrop { 
      0% { transform: translateY(-300px) translateX(-100px) rotate(0deg); opacity: 0; }
      30% { opacity: 1; }
      50% { transform: translateY(0px) translateX(-100px) rotate(720deg); }
      58% { transform: translateY(-30px) translateX(-80px) rotate(760deg); }
      65% { transform: translateY(0px) translateX(-60px) rotate(800deg); }
      70% { transform: translateY(-10px) translateX(-40px) rotate(830deg); }
      75% { transform: translateY(0px) translateX(-20px) rotate(860deg); }
      80% { transform: translateY(-3px) translateX(0px) rotate(890deg); }
      85% { transform: translateY(0px) translateX(20px) rotate(920deg); }
      90% { transform: translateY(0px) translateX(40px) rotate(950deg); }
      95% { transform: translateY(0px) translateX(55px) rotate(975deg); }
      100% { transform: translateY(0px) translateX(60px) rotate(990deg); }
    }
    @keyframes cardFlip { 
      0% { transform: perspective(1000px) rotateY(-90deg); opacity: 0; }
      100% { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
    }
    @keyframes confettiFall { 
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .group:hover .sword-hover { animation: swordClash 0.6s ease-in-out infinite; }
    @keyframes swordClash { 
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-20deg) scale(1.2); }
      75% { transform: rotate(20deg) scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
