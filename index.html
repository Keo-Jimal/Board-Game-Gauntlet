<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Board Game Gauntlet - Daily Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sound System using real audio files
        const SoundSystem = () => {
          const sounds = useRef({
            diceRoll: new Audio('./sounds/dice-roll.mp3'),
            cardFlip: new Audio('./sounds/card-flip.mp3'),
            success: new Audio('./sounds/success.mp3'),
            fail: new Audio('./sounds/wrong.mp3'),
            celebrate: new Audio('./sounds/victory.mp3')
          });

          // Set volume for all sounds
          useEffect(() => {
            Object.values(sounds.current).forEach(sound => {
              sound.volume = 0.5; // 50% volume
            });
          }, []);

          const playSound = (soundName) => {
            const sound = sounds.current[soundName];
            if (sound) {
              sound.currentTime = 0; // Reset to start
              sound.play().catch(e => console.log('Sound play failed:', e));
            }
          };

          return {
            diceRoll: () => playSound('diceRoll'),
            success: () => playSound('success'),
            fail: () => playSound('fail'),
            cardFlip: () => playSound('cardFlip'),
            celebrate: () => playSound('celebrate')
          };
        };

        // Volume/Mute icon component
        const VolumeIcon = ({ muted, ...props }) => (
          muted ? (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          ) : (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          )
        );

        // Simple icon components
        const CheckCircle = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );

        const Trophy = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
        );

        const Skull = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 20v2h8v-2"></path><path d="m12.5 17-.5-1-.5 1h1z"></path><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path></svg>
        );

        const Hourglass = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg>
        );

        const GAMES = [
          { id: 1, game: "Wingspan", hint: "Birds of a Feather", statements: ["Players collect and play bird cards to attract visitors", "The game uses a rondel mechanism for actions", "It's an engine-building game about bird habitats"], falseIndex: 1 },
          { id: 2, game: "Azul", hint: "Tile Style", statements: ["Players draft tiles from a central market", "The game is set in ancient Rome", "Negative points are possible for unused tiles"], falseIndex: 1 },
          { id: 3, game: "Splendor", hint: "Crown Jewels", statements: ["Players collect gem tokens to buy development cards", "The game uses dice to determine gem availability", "Noble patrons visit players who meet requirements"], falseIndex: 1 },
          { id: 4, game: "Catan", hint: "Settle Down", statements: ["Players roll dice to gather resources", "The game board is always the same layout", "Trading with other players is a core mechanic"], falseIndex: 1 },
          { id: 5, game: "Ticket to Ride", hint: "All Aboard", statements: ["Players claim railway routes between cities", "The game was first published in the 1980s", "Longer routes score more points"], falseIndex: 1 },
          { id: 6, game: "Pandemic", hint: "Outbreak Alert", statements: ["Players work cooperatively to stop global diseases", "Each player has a secret role only they know", "Disease cubes spread between connected cities"], falseIndex: 1 },
          { id: 7, game: "7 Wonders", hint: "Ancient Glory", statements: ["Players simultaneously choose cards each turn", "The game is played over exactly seven rounds", "You develop a civilization across three ages"], falseIndex: 1 },
          { id: 8, game: "Dominion", hint: "Build Your Kingdom", statements: ["It popularized the deck-building genre", "Players place meeples on action spaces", "You buy cards to improve your deck over time"], falseIndex: 1 },
          { id: 9, game: "Codenames", hint: "Secret Identities", statements: ["Team spymasters give one-word clues", "Players draw cards and act out clues for teammates", "The game uses a 5x5 grid of word cards"], falseIndex: 1 },
          { id: 10, game: "Carcassonne", hint: "Medieval Landscape", statements: ["Players place tiles to build cities and roads", "The game uses a dice-rolling combat system", "Meeples are placed on tiles to score points"], falseIndex: 1 },
          { id: 11, game: "Scrabble", hint: "Letter Perfect", statements: ["Players form words using letter tiles", "The game was released in the 1970s", "Each letter has a different point value"], falseIndex: 1 },
          { id: 12, game: "King of Tokyo", hint: "Monster Mash", statements: ["Players control giant monsters fighting for Tokyo", "Victory points are gained by staying in Paris", "Dice are rolled to determine actions each turn"], falseIndex: 1 }
        ];

        const getComment = (type, data = {}) => {
          const c = {
            pass: ["Coward.", "Second thoughts? Good.", "Running scared?", "Maybe you're smarter than you look."],
            many: [`${data.passes} passes? Commitment issues?`, "Pick something. This is painful."],
            early: ["Lucky guess.", "One down. Eleven to go.", "Don't get cocky."],
            mid: [`${data.streak} in a row. Impressive... for a human.`, `${data.streak} cards. You might know board games.`],
            high: [`${data.streak} in a row! When will you slip?`, "Impressive. Don't blow it now."],
            low: ["Already? That was embarrassing.", "One card. ONE. Your ancestors weep."],
            midFail: [`${data.streak} cards isn't terrible. For a goblin.`, `${data.streak} out of 12. Mediocre.`],
            highFail: [`${data.streak} cards! So close to glory.`, `ONE AWAY. This will haunt you.`],
            eleven: ["ELEVEN. ELEVEN CARDS. One away from perfection.", "11/12. This will haunt your dreams."],
            perfect: ["Impossible. You must have cheated.", "12/12. I didn't think mortals could do that."],
            confirm: ["Feeling lucky?", "Once you commit, there's no going back.", "This could be your last card..."]
          };
          return c[type][Math.floor(Math.random() * c[type].length)];
        };

        const DICE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        const shuffleStatements = (game) => {
          const statements = [...game.statements];
          const falseStatement = statements[game.falseIndex];
          
          for (let i = statements.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [statements[i], statements[j]] = [statements[j], statements[i]];
          }
          
          const newFalseIndex = statements.indexOf(falseStatement);
          
          return { ...game, statements, falseIndex: newFalseIndex };
        };

        // Helper functions for daily limit
        const getTodayKey = () => {
          const today = new Date();
          return `gauntlet-${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
        };

        const hasPlayedToday = () => {
          const todayKey = getTodayKey();
          const lastPlay = localStorage.getItem('gauntlet-last-play');
          return lastPlay === todayKey;
        };

        const getNextPlayTime = () => {
          const tomorrow = new Date();
          tomorrow.setHours(24, 0, 0, 0); // Midnight tonight
          return tomorrow;
        };

        const getTimeUntilMidnight = () => {
          const now = new Date();
          const midnight = new Date();
          midnight.setHours(24, 0, 0, 0);
          const diff = midnight - now;
          
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          
          return { hours, minutes, seconds, total: diff };
        };

        const savePlayToday = () => {
          const todayKey = getTodayKey();
          localStorage.setItem('gauntlet-last-play', todayKey);
        };

        function Gauntlet() {
          const [cards, setCards] = useState(GAMES.map(g => shuffleStatements(g)).map(g => ({ ...g, state: 'hidden' })));
          const [selected, setSelected] = useState(null);
          const [solved, setSolved] = useState([]);
          const [passes, setPasses] = useState(0);
          const [over, setOver] = useState(false);
          const [won, setWon] = useState(false);
          const [comment, setComment] = useState("Choose your first card to begin...");
          const [emoji, setEmoji] = useState("😏");
          const [started, setStarted] = useState(false);
          const [start, setStart] = useState(null);
          const [time, setTime] = useState(0);
          const [final, setFinal] = useState(null);
          const [intro, setIntro] = useState(true);
          const [diceFace, setDiceFace] = useState(DICE_FACES[Math.floor(Math.random() * 6)]);
          const [showConfetti, setShowConfetti] = useState(false);
          const [muted, setMuted] = useState(false);
          const [alreadyPlayed, setAlreadyPlayed] = useState(false);
          const [countdown, setCountdown] = useState(getTimeUntilMidnight());

          const sounds = SoundSystem();

          // Check if already played today on mount
          useEffect(() => {
            if (hasPlayedToday()) {
              setAlreadyPlayed(true);
              setIntro(false); // Skip intro if locked out
            }
          }, []);

          // Update countdown every second when locked out
          useEffect(() => {
            let interval;
            if (alreadyPlayed) {
              interval = setInterval(() => {
                const timeLeft = getTimeUntilMidnight();
                setCountdown(timeLeft);
                
                // If we've passed midnight, unlock the game
                if (timeLeft.total <= 0) {
                  setAlreadyPlayed(false);
                  window.location.reload(); // Refresh to reset game
                }
              }, 1000);
            }
            return () => clearInterval(interval);
          }, [alreadyPlayed]);

          useEffect(() => {
            let i;
            if (started && !over) {
              i = setInterval(() => setTime(Math.floor((Date.now() - start) / 1000)), 1000);
            }
            return () => clearInterval(i);
          }, [started, over, start]);

          const playSound = (soundFn) => {
            if (!muted && soundFn) {
              try {
                soundFn();
              } catch (e) {
                console.log('Sound playback failed:', e);
              }
            }
          };

          const fmt = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;

          const click = (id) => {
            if (over || cards.find(c => c.id === id).state === 'solved') return;
            if (!started) { setStarted(true); setStart(Date.now()); }
            setSelected(id);
            setComment(getComment('confirm'));
            setEmoji("👁️");
            playSound(sounds.cardFlip);
          };

          const pass = () => {
            const p = passes + 1;
            setPasses(p);
            setComment(p >= 8 ? getComment('many', {passes: p}) : getComment('pass'));
            setEmoji(p >= 8 ? "😤" : "🙄");
            setSelected(null);
          };

          const commit = () => {
            setCards(cards.map(c => c.id === selected ? {...c, state: 'revealed'} : c));
            playSound(sounds.cardFlip);
          };

          const answer = (id, i) => {
            const c = cards.find(x => x.id === id);
            if (i === c.falseIndex) {
              playSound(sounds.success);
              const s = [...solved, c];
              setSolved(s);
              setCards(cards.map(x => x.id === id ? {...x, state: 'solved'} : x));
              if (s.length === 12) {
                setWon(true); setOver(true); setFinal(time);
                setComment(getComment('perfect')); setEmoji("🤩");
                setShowConfetti(true);
                playSound(sounds.celebrate);
                savePlayToday(); // Save that they played today
                setTimeout(() => {
                  setShowConfetti(false);
                }, 5000);
              } else if (s.length <= 2) {
                setComment(getComment('early')); setEmoji("🤨");
              } else if (s.length <= 6) {
                setComment(getComment('mid', {streak: s.length})); setEmoji("😏");
              } else {
                setComment(getComment('high', {streak: s.length})); setEmoji("😮");
              }
              setSelected(null);
            } else {
              playSound(sounds.fail);
              setOver(true); setFinal(time);
              savePlayToday(); // Save that they played today
              const st = solved.length;
              if (st === 11) { setComment(getComment('eleven')); setEmoji("😱"); }
              else if (st <= 2) { setComment(getComment('low')); setEmoji("😂"); }
              else if (st <= 7) { setComment(getComment('midFail', {streak: st})); setEmoji("😈"); }
              else { setComment(getComment('highFail', {streak: st})); setEmoji("💀"); }
            }
          };

          const share = () => {
            const ch = '🐔'.repeat(Math.min(passes, 5)) + (passes > 5 ? `+${passes-5}` : '');
            return `🎲 Board Game Gauntlet\nStreak: ${solved.length}/12 ${won?'🏆':'💀'}\nTime: ${fmt(final)}\nPasses: ${passes} ${ch}\n\nThe DM says: "${comment}"\n\nPlay at merchantsofplay.com`;
          };

          const startGame = () => {
            setIntro(false);
            playSound(sounds.diceRoll);
          };

          const av = cards.filter(c => c.state !== 'solved');

          return (
            <div className="min-h-screen bg-gradient-to-br from-purple-900 via-purple-800 to-indigo-900 text-white">
              {/* Mute Button - Fixed Position */}
              <button 
                onClick={() => setMuted(!muted)}
                className="fixed top-4 right-4 z-50 bg-black bg-opacity-50 hover:bg-opacity-70 p-3 rounded-full transition backdrop-blur-sm"
                aria-label={muted ? "Unmute sounds" : "Mute sounds"}
              >
                <VolumeIcon muted={muted} className="w-6 h-6" />
              </button>

              {/* Already Played Today Screen */}
              {alreadyPlayed && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black p-4 sm:p-6">
                  <div className="max-w-2xl w-full text-center">
                    <div className="text-6xl sm:text-8xl mb-6">🔒</div>
                    <h1 className="text-3xl sm:text-5xl font-bold mb-4 text-yellow-400">You've Already Played Today!</h1>
                    <p className="text-lg sm:text-xl text-purple-200 mb-6">Come back tomorrow for a fresh challenge</p>
                    
                    <div className="bg-gradient-to-br from-yellow-100 to-amber-50 text-gray-900 rounded-2xl p-6 sm:p-8 border-4 border-yellow-600 mb-6 inline-block">
                      <div className="text-sm font-bold text-yellow-800 mb-2 uppercase tracking-wider">Next Gauntlet In:</div>
                      <div className="text-4xl sm:text-6xl font-bold mb-2">
                        {String(countdown.hours).padStart(2, '0')}:{String(countdown.minutes).padStart(2, '0')}:{String(countdown.seconds).padStart(2, '0')}
                      </div>
                      <div className="text-xs sm:text-sm text-gray-600">Resets at midnight</div>
                    </div>

                    <div className="bg-black bg-opacity-50 rounded-xl p-4 sm:p-6 backdrop-blur-sm mb-6">
                      <p className="text-purple-200 text-sm sm:text-base mb-4">While you wait, check out:</p>
                      <div className="flex gap-3 justify-center flex-wrap mb-4">
                        <a href="https://app.merchantsofplay.com" target="_blank" rel="noopener noreferrer" className="bg-indigo-600 hover:bg-indigo-700 px-6 sm:px-8 py-2 sm:py-3 rounded-lg text-base sm:text-lg font-bold touch-manipulation">Merchants of Play</a>
                      </div>
                      <div className="flex gap-3 justify-center flex-wrap">
                        <a href="https://discord.gg/merchantsofplay" target="_blank" rel="noopener noreferrer" className="bg-[#5865F2] hover:bg-[#4752C4] px-6 sm:px-8 py-2 sm:py-3 rounded-lg text-base sm:text-lg font-bold inline-flex items-center gap-2 touch-manipulation">
                          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
                          Join Discord
                        </a>
                      </div>
                    </div>

                    <p className="text-xs sm:text-sm text-purple-400 italic">
                      Tip: Clearing your browser cookies will let you play again, but where's the honor in that? 😉
                    </p>
                  </div>
                </div>
              )}

              {showConfetti && (
                <div className="confetti-container">
                  {[...Array(50)].map((_, i) => (
                    <div 
                      key={i} 
                      className="confetti"
                      style={{
                        left: `${Math.random() * 100}%`,
                        animationDelay: `${Math.random() * 0.5}s`,
                        backgroundColor: ['#FFD700', '#FFA500', '#FF69B4', '#00CED1', '#9370DB'][Math.floor(Math.random() * 5)]
                      }}
                    />
                  ))}
                </div>
              )}

              {/* Main Game Content - Only show if haven't played today */}
              {!alreadyPlayed && (
                <>
              {intro && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black p-4 sm:p-6">
                  <div className="max-w-2xl w-full">
                    <div className="text-center mb-4 sm:mb-6">
                      <div className="text-5xl sm:text-7xl mb-4 animate-diceDrop">{diceFace}</div>
                      <h1 className="text-3xl sm:text-5xl font-bold mb-2 text-yellow-400 animate-fadeIn">⚔️ Board Game Gauntlet ⚔️</h1>
                      <p className="text-base sm:text-lg text-purple-300 animate-fadeIn">A Daily Test of Board Game Knowledge</p>
                    </div>
                    <div className="bg-gradient-to-br from-yellow-100 to-amber-50 text-gray-900 rounded-2xl p-4 sm:p-6 border-4 border-yellow-600 mb-4 sm:mb-6 animate-fadeInUp">
                      <div className="space-y-3 sm:space-y-4 text-center">
                        <p className="flex items-center gap-2 sm:gap-3 justify-center text-sm sm:text-lg"><span className="text-2xl sm:text-3xl">🃏</span> 12 mysterious cards with cryptic hints</p>
                        <p className="flex items-center gap-2 sm:gap-3 justify-center text-sm sm:text-lg"><span className="text-2xl sm:text-3xl">🔍</span> Click to preview, commit to answer</p>
                        <p className="flex items-center gap-2 sm:gap-3 justify-center text-sm sm:text-lg"><span className="text-2xl sm:text-3xl">💀</span> One wrong answer ends your run</p>
                        <p className="flex items-center gap-2 sm:gap-3 justify-center text-sm sm:text-lg"><span className="text-2xl sm:text-3xl">🐔</span> Pass and return later (tracked)</p>
                      </div>
                    </div>
                    <div className="text-center animate-fadeInUp">
                      <button onClick={startGame} className="bg-gradient-to-r from-amber-500 to-yellow-600 text-gray-900 px-8 sm:px-10 py-3 sm:py-4 rounded-xl text-lg sm:text-xl font-bold hover:scale-105 transition border-4 border-yellow-700 group touch-manipulation">
                        <span className="inline-block sword-hover">⚔️</span> ENTER THE GAUNTLET <span className="inline-block sword-hover">⚔️</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <div className="p-3 sm:p-4 max-w-6xl mx-auto">
                {!over && (
                  <>
                    <div className="text-center mb-4">
                      <h1 className="text-2xl sm:text-3xl font-bold mb-2">⚔️ Board Game Gauntlet ⚔️</h1>
                      <div className="flex justify-center gap-3 sm:gap-6 text-base sm:text-lg flex-wrap">
                        <div className="flex items-center gap-2"><Hourglass className="w-4 h-4 sm:w-5 sm:h-5"/>{started ? fmt(time) : '0:00'}</div>
                        <div className="flex items-center gap-2"><CheckCircle className="w-4 h-4 sm:w-5 sm:h-5 text-green-400"/>{solved.length}/12</div>
                        <div className="flex items-center gap-2">🐔 {passes}</div>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-yellow-100 to-yellow-50 text-gray-900 rounded-2xl p-4 sm:p-6 border-4 border-yellow-600 mb-4 sm:mb-6 relative max-w-2xl mx-auto">
                      <div className="flex gap-3 sm:gap-4 items-center justify-center">
                        <div className="text-3xl sm:text-5xl flex-shrink-0">{emoji}</div>
                        <div className="text-center flex-1">
                          <div className="text-xs font-bold text-yellow-800 mb-1 sm:mb-2 uppercase tracking-wider">The Dungeon Master</div>
                          <div className="text-base sm:text-xl italic font-medium leading-relaxed">{comment}</div>
                        </div>
                      </div>
                      <div className="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[15px] border-t-yellow-600"></div>
                    </div>
                  </>
                )}

                {over && (
                  <div className="bg-black bg-opacity-70 rounded-lg p-4 sm:p-6 mb-6 text-center border-2 border-purple-400">
                    {won ? <><Trophy className="w-10 h-10 sm:w-12 sm:h-12 text-yellow-400 mx-auto mb-3"/><h2 className="text-xl sm:text-2xl font-bold text-yellow-400 mb-2">PERFECT RUN! 🏆</h2></> : <><Skull className="w-10 h-10 sm:w-12 sm:h-12 text-red-400 mx-auto mb-3"/><h2 className="text-xl sm:text-2xl font-bold text-red-400 mb-2">RUN ENDED</h2></>}
                    
                    <div className="bg-gradient-to-br from-yellow-100 to-yellow-50 text-gray-900 rounded-2xl p-4 sm:p-5 border-4 border-yellow-600 mb-4 inline-block max-w-md">
                      <div className="flex gap-3 items-center">
                        <div className="text-2xl sm:text-3xl">{emoji}</div>
                        <div className="text-left">
                          <div className="text-xs font-bold text-yellow-800 mb-1">THE DUNGEON MASTER</div>
                          <div className="text-sm sm:text-base italic">"{comment}"</div>
                        </div>
                      </div>
                    </div>

                    <div className="mb-4 text-base sm:text-lg"><div>Streak: <span className="font-bold">{solved.length}/12</span></div><div>Time: <span className="font-bold">{fmt(final)}</span></div><div>Passes: <span className="font-bold">{passes} {'🐔'.repeat(Math.min(passes,3))}</span></div></div>
                    
                    <div className="flex gap-2 justify-center flex-wrap mb-6">
                      <button onClick={() => {
                        const text = share();
                        navigator.clipboard.writeText(text).then(() => {
                          alert('Results copied to clipboard!');
                        }).catch(() => {
                          alert('Failed to copy. Please try selecting and copying manually.');
                        });
                      }} className="bg-purple-600 hover:bg-purple-700 px-3 sm:px-4 py-2 rounded font-bold text-sm sm:text-base touch-manipulation">📋 Copy Results</button>
                      <a href={`https://twitter.com/intent/tweet?text=${encodeURIComponent(share())}`} target="_blank" rel="noopener noreferrer" className="bg-black hover:bg-gray-900 px-3 sm:px-4 py-2 rounded font-bold inline-flex items-center gap-2 text-sm sm:text-base touch-manipulation">
                        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        Share on X
                      </a>
                      <a href={`https://www.facebook.com/sharer/sharer.php?u=https://merchantsofplay.com&quote=${encodeURIComponent(share())}`} target="_blank" rel="noopener noreferrer" className="bg-blue-700 hover:bg-blue-800 px-3 sm:px-4 py-2 rounded font-bold text-sm sm:text-base touch-manipulation">📘 Facebook</a>
                    </div>
                    
                    <div className="border-t border-purple-600 pt-6">
                      <p className="text-purple-200 text-base sm:text-lg mb-4">
                        Come back tomorrow for the next Gauntlet!<br/>
                        <span className="text-sm text-purple-300">Resets at midnight</span>
                      </p>
                      <p className="text-purple-300 text-sm sm:text-base mb-3">Browse our catalog of board games at</p>
                      <div className="flex gap-3 justify-center flex-wrap mb-5">
                        <a href="https://app.merchantsofplay.com" target="_blank" rel="noopener noreferrer" className="bg-indigo-600 hover:bg-indigo-700 px-6 sm:px-8 py-2 sm:py-3 rounded-lg text-base sm:text-lg font-bold touch-manipulation">Merchants of Play</a>
                      </div>
                      <p className="text-purple-300 text-sm sm:text-base mb-3">Join our community of board gamers</p>
                      <div className="flex gap-3 justify-center flex-wrap">
                        <a href="https://discord.gg/merchantsofplay" target="_blank" rel="noopener noreferrer" className="bg-[#5865F2] hover:bg-[#4752C4] px-6 sm:px-8 py-2 sm:py-3 rounded-lg text-base sm:text-lg font-bold inline-flex items-center gap-2 touch-manipulation">
                          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
                          Discord
                        </a>
                      </div>
                    </div>
                  </div>
                )}

                {!over && (
                  <>
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3 mb-4">
                      {av.map(c => c.state === 'hidden' && (
                        <div key={c.id} onClick={() => click(c.id)} className="bg-gradient-to-br from-purple-600 to-indigo-600 rounded-lg p-3 sm:p-4 cursor-pointer hover:scale-105 active:scale-95 transition border-2 border-purple-400 min-h-[100px] sm:h-28 flex items-center justify-center touch-manipulation">
                          <div className="text-center"><div className="text-base sm:text-sm mb-1">🎴</div><div className="text-xs italic leading-tight">"{c.hint}"</div></div>
                        </div>
                      ))}
                    </div>

                    {selected && cards.find(c => c.id === selected)?.state === 'hidden' && (
                      <div className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-4">
                        <div className="bg-gradient-to-br from-purple-900 to-indigo-900 rounded-lg p-4 sm:p-6 border-4 border-yellow-500 max-w-lg w-full">
                          <div className="text-center mb-4">
                            <div className="text-xl sm:text-2xl font-bold mb-2">"{cards.find(c => c.id === selected).hint}"</div>
                            <div className="text-sm text-gray-300">Accept this challenge?</div>
                          </div>
                          <div className="flex gap-3 justify-center">
                            <button onClick={commit} className="bg-green-600 hover:bg-green-700 active:bg-green-800 px-6 sm:px-8 py-3 rounded-lg font-bold text-sm sm:text-base touch-manipulation">I'll Take It</button>
                            <button onClick={pass} className="bg-gray-600 hover:bg-gray-700 active:bg-gray-800 px-6 sm:px-8 py-3 rounded-lg font-bold text-sm sm:text-base touch-manipulation">Pass 🐔</button>
                          </div>
                        </div>
                      </div>
                    )}

                    {selected && cards.find(c => c.id === selected)?.state === 'revealed' && (
                      <div className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-4 overflow-y-auto">
                        <div className="bg-gradient-to-br from-purple-900 to-indigo-900 rounded-lg p-4 sm:p-6 border-4 border-red-500 max-w-2xl w-full animate-cardFlip my-auto">
                          <div className="text-center mb-4">
                            <div className="text-2xl sm:text-3xl font-bold mb-2">{cards.find(c => c.id === selected).game}</div>
                            <div className="text-yellow-400 mb-3 text-sm sm:text-base">Which statement is FALSE?</div>
                          </div>
                          <div className="space-y-2">
                            {cards.find(c => c.id === selected).statements.map((s, i) => (
                              <button key={i} onClick={() => answer(selected, i)} className="w-full text-left p-3 sm:p-4 rounded bg-gray-800 hover:bg-gray-700 active:bg-gray-600 border-2 border-gray-600 hover:border-yellow-500 transition text-sm sm:text-base leading-snug touch-manipulation">{s}</button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {solved.length > 0 && (
                      <div className="mt-4"><h3 className="text-xs sm:text-sm text-purple-300 mb-2">Conquered:</h3><div className="flex flex-wrap gap-2">{solved.map(c => <div key={c.id} className="bg-green-900 bg-opacity-50 px-2 py-1 rounded text-xs border border-green-600">✓ {c.game}</div>)}</div></div>
                    )}
                  </>
                )}
                  </>
                )}
              </div>

              <style>{`
                @keyframes fadeIn { 
                  from {opacity:0} 
                  to {opacity:1} 
                }
                @keyframes fadeInUp { 
                  from {opacity:0; transform:translateY(20px)} 
                  to {opacity:1; transform:translateY(0)} 
                }
                @keyframes diceDrop { 
                  0% { 
                    transform: translateY(-300px) translateX(-100px) rotate(0deg);
                    opacity: 0;
                  }
                  30% {
                    opacity: 1;
                  }
                  50% { 
                    transform: translateY(0px) translateX(-100px) rotate(720deg);
                  }
                  58% { 
                    transform: translateY(-30px) translateX(-80px) rotate(760deg);
                  }
                  65% { 
                    transform: translateY(0px) translateX(-60px) rotate(800deg);
                  }
                  70% { 
                    transform: translateY(-10px) translateX(-40px) rotate(830deg);
                  }
                  75% { 
                    transform: translateY(0px) translateX(-20px) rotate(860deg);
                  }
                  80% { 
                    transform: translateY(-3px) translateX(0px) rotate(890deg);
                  }
                  85% {
                    transform: translateY(0px) translateX(20px) rotate(920deg);
                  }
                  90% {
                    transform: translateY(0px) translateX(40px) rotate(950deg);
                  }
                  95% {
                    transform: translateY(0px) translateX(55px) rotate(975deg);
                  }
                  100% { 
                    transform: translateY(0px) translateX(60px) rotate(990deg);
                  }
                }
                @keyframes swordClash { 
                  0%, 100% { transform: rotate(0deg); }
                  25% { transform: rotate(-20deg) scale(1.2); }
                  75% { transform: rotate(20deg) scale(1.2); }
                }
                @keyframes cardFlip {
                  0% {
                    transform: perspective(1000px) rotateY(-90deg);
                    opacity: 0;
                  }
                  100% {
                    transform: perspective(1000px) rotateY(0deg);
                    opacity: 1;
                  }
                }
                @keyframes confettiFall {
                  0% {
                    transform: translateY(-100vh) rotate(0deg);
                    opacity: 1;
                  }
                  100% {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                  }
                }
                .animate-fadeIn { 
                  animation: fadeIn 0.8s forwards;
                  animation-delay: 0.8s;
                  opacity: 0;
                }
                .animate-fadeInUp { 
                  animation: fadeInUp 1s forwards 1.5s; 
                  animation-fill-mode: both; 
                  opacity: 0;
                }
                .animate-diceDrop { 
                  animation: diceDrop 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                }
                .animate-cardFlip {
                  animation: cardFlip 0.4s ease-out forwards;
                }
                .group:hover .sword-hover { 
                  animation: swordClash 0.6s ease-in-out infinite; 
                }
                .confetti-container {
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  pointer-events: none;
                  z-index: 9999;
                  overflow: hidden;
                }
                .confetti {
                  position: absolute;
                  width: 10px;
                  height: 10px;
                  top: -10px;
                  animation: confettiFall 3s linear forwards;
                }
                
                /* Mobile-specific improvements */
                .touch-manipulation {
                  touch-action: manipulation;
                  -webkit-tap-highlight-color: transparent;
                }
                
                @media (max-width: 640px) {
                  body {
                    -webkit-text-size-adjust: 100%;
                  }
                }
              `}</style>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Gauntlet />);

        console.log('✅ Board Game Gauntlet Phase 1B loaded - Mobile + Sounds + Daily Limit!');
    </script>
</body>
</html>
